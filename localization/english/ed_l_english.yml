 ed_events.3001.t:0 "House Cohesion"
 ed_events.3001.desc:0 "The exalted house pulses as one blood. Kin draw closer, cadets feel the pull of the house, and a modest renown splash marks the beat."
 ed_events.3001.a:0 "One house."
 ed_events.3201.t:0 "Bless a Cadet House"
 ed_events.3201.desc:0 "Use the Bless Cadet House interaction on a house head of your dynasty whose house is not already exalted. This grants secondary exaltation without revoking your primary house. Cap is set by the Secondary House Cap game rule."
 ed_events.3201.a:0 "Back to Hub"
 ed_events.3201.a_tt:0 "Return to the manage hub"
 ed_events.3202.t:0 "Cadet House Blessed"
 ed_events.3202.desc:0 "A cadet house now shares the exaltation as a secondary blessing. Their living members carry Exalted Dynast. Revoking your primary house does not strip them."
 ed_events.3202.a:0 "Let the cadets rise."
